# Auslieferung der Angular-App (Einzelseiten-App mit Service Worker), als Benutzer ohne Root auf Port 8080.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Für die Probes des Orchestrators
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Diese Dateien ändern sich ohne neuen Dateinamen (Einstellungen, Einstieg, Service Worker): immer nachfragen.
    # Sonst läuft nach einem Update noch tagelang die alte App oder der alte Service Worker.
    location ~ ^/(?:index\.html|config\.json|ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Der Build hängt einen Hash an den Dateinamen (main-RI2V7YUT.js, media/roboto-...woff2): für immer zwischenspeichern.
    # Eine fehlende Datei ist ein 404, nie die Startseite (sonst käme HTML statt JavaScript an). Ohne `always` setzt
    # nginx den Header nur bei Erfolgsantworten, ein 404 wird also nicht für ein Jahr gemerkt.
    # (Der Ausdruck steht in Anführungszeichen, sonst liest nginx die geschweiften Klammern als Blockende.)
    location ~ "^/(?:[^/]+-[A-Za-z0-9_-]{8}\.(?:js|css)|media/.+)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Alles andere ist eine Seite der App (/turniere/42, /auth/callback, ...): die Startseite liefern, der Router übernimmt.
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
