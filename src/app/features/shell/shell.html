<mat-toolbar class="bar">
  <a class="brand" routerLink="/turniere" aria-label="Kickertool, zur Turnierliste">
    <mat-icon aria-hidden="true">sports_soccer</mat-icon>
    <span>Kickertool</span>
  </a>

  <span class="spacer"></span>

  @if (auth.me(); as me) {
    <button mat-button [matMenuTriggerFor]="userMenu" class="user" aria-label="Benutzermenü">
      <mat-icon aria-hidden="true">account_circle</mat-icon>
      <span class="name">{{ me.displayName }}</span>
      @if (me.admin) {
        <span class="role">Admin</span>
      }
    </button>
    <mat-menu #userMenu="matMenu">
      @if (alerts.canAskPermission()) {
        <button mat-menu-item type="button" (click)="alerts.enableSystemNotifications()">
          <mat-icon aria-hidden="true">notifications</mat-icon>
          <span>Benachrichtigungen erlauben</span>
        </button>
      }
      <button mat-menu-item type="button" (click)="alerts.setSound(!alerts.soundOn())">
        <mat-icon aria-hidden="true">{{ alerts.soundOn() ? 'volume_up' : 'volume_off' }}</mat-icon>
        <span>{{ alerts.soundOn() ? 'Ton bei „Du bist dran“ ausschalten' : 'Ton bei „Du bist dran“ einschalten' }}</span>
      </button>
      <button mat-menu-item type="button" (click)="logout()">
        <mat-icon aria-hidden="true">logout</mat-icon>
        <span>Abmelden</span>
      </button>
    </mat-menu>
  }
</mat-toolbar>

<app-turn-banner />

<main class="content">
  <router-outlet />
</main>
