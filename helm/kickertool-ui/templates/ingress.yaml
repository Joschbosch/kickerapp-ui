{{- if .Values.ingress.enabled }}
{{- $host := include "kickertool-ui.ingressHost" . }}
{{- if not $host }}
{{- fail "ingress.host (oder global.host) ist nötig, wenn ingress.enabled=true" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kickertool-ui.fullname" . }}
  labels:
    {{- include "kickertool-ui.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with (default (default dict .Values.global).ingressClassName .Values.ingress.className) }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with (include "kickertool-ui.ingressTls" .) }}
  tls:
    {{- . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "kickertool-ui.fullname" . }}
                port:
                  name: http
{{- end }}
