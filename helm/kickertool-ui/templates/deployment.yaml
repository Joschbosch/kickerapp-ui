apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kickertool-ui.fullname" . }}
  labels:
    {{- include "kickertool-ui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kickertool-ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kickertool-ui.selectorLabels" . | nindent 8 }}
      annotations:
        # Die Datei kommt über subPath und wird nicht von selbst aktualisiert: bei geänderter Konfiguration neu starten
        checksum/config: {{ include "kickertool-ui.configJson" . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: {{ include "kickertool-ui.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
              readOnly: true
            # nginx legt Prozess-ID und Zwischenspeicher unter /tmp ab
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "kickertool-ui.fullname" . }}
        - name: tmp
          emptyDir: {}
