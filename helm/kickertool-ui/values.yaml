# Standardwerte für das Chart der Kickertool-UI.
# Das Chart startet nur die UI (nginx mit den statischen Dateien). Das Backend und Keycloak kommen aus dem Chart
# `kickertool` im Backend-Repo. Pflicht sind die Adressen, unter denen der BROWSER die API und Keycloak erreicht.

nameOverride: ""
fullnameOverride: ""

# Gemeinsame Werte, die das Gesamt-Chart `kickertool-stack` für alle Teile setzt. Daraus entstehen config.apiBaseUrl,
# config.oidc.authority und ingress.host, soweit sie nicht selbst gesetzt sind. Beim Einzelbetrieb leer lassen.
#   global.host:          Host der UI und der API, z. B. turnier.example.com
#   global.authHost:      Host von Keycloak, z. B. auth.example.com
#   global.realm:         Realm in Keycloak (Standard kickertool)
#   global.tls:           HTTPS (Adressen mit https://, TLS-Abschnitt am Ingress)
#   global.tlsSecretName: Secret mit dem Zertifikat, leer = Standardzertifikat des Ingress
#   global.ingressClassName: Klasse des Ingress (ersetzt nur ein leeres ingress.className)
global: {}

image:
  repository: kickertool-ui
  # leer = appVersion aus Chart.yaml
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 1

# Wird als config.json in die UI gelegt (ConfigMap). Ändert sich der Inhalt, starten die Pods neu.
config:
  # Adresse des Backends, so wie der Browser sie aufruft, ohne abschließenden Schrägstrich, z. B. https://api.turnier.example.com
  apiBaseUrl: ""
  # `oidc` (Keycloak o. Ä.) oder `password` (nur für das lokale Backend mit simuliertem Login, nie im Betrieb)
  authMode: oidc
  oidc:
    # Adresse des Realms, genau wie der Aussteller (`iss`) im Token, z. B. https://auth.turnier.example.com/realms/kickertool
    authority: ""
    clientId: kickertool-app
    # Nur für Tests im eigenen Netz über HTTP (z. B. am Handy). Im Betrieb gehört HTTPS davor, dann false lassen.
    allowInsecureContext: false

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Host der UI
  host: ""
  tls: []
  #  - secretName: kickertool-ui-tls
  #    hosts: [turnier.example.com]

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    memory: 128Mi
